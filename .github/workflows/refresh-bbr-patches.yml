name: Refresh-BBR-Patches

on:
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: "ImmortalWrt Upstream Commit"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: "refresh-bbr-patches-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh BBR Patches
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "::group::Install build dependencies"
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
          )
          sudo -E apt-get "${apt_options[@]}" -yqq update >/dev/null
          sudo -E env NEEDRESTART_SUSPEND=1 \
            apt-get "${apt_options[@]}" -yqq install --no-install-recommends --no-upgrade \
              build-essential gawk gettext libncurses-dev libssl-dev python3 quilt rsync swig unzip \
              zlib1g-dev libelf-dev libdw-dev libbz2-dev liblzma-dev libzstd-dev >/dev/null
          echo "::endgroup::"

      - name: Refresh Patches
        env:
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/core.sh"
          source "$GITHUB_WORKSPACE/profiles/upstream.conf"

          expected_patch_count=20
          target_kernel_patchver=6.12
          repo_patch_dir="$GITHUB_WORKSPACE/patches/bbrv3"
          worktree="$GITHUB_WORKSPACE/wrt"

          group_run() {
            local title="$1"
            shift
            local status

            group "$title"
            set +e
            "$@"
            status=$?
            set -e
            endgroup
            return "$status"
          }

          upstream_commit=$(printf '%s' "$UPSTREAM_COMMIT" | tr -d '[:space:]')
          if ! [[ "$upstream_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            die "upstream_commit must be a full 40-char commit SHA"
          fi
          log "Input commit: $upstream_commit"

          patch_count=$(find "$repo_patch_dir" -maxdepth 1 -type f -name '010-bbr3-*.patch' | wc -l | tr -d '[:space:]')
          if [ "$patch_count" -ne "$expected_patch_count" ]; then
            die "Expected $expected_patch_count BBRv3 patches, found $patch_count"
          fi
          log "Source patches: $patch_count"

          group "Clone source"
          rm -rf "$worktree"
          git init "$worktree"
          cd "$worktree"
          git remote add origin "$WRT_REPO"
          git fetch --depth=1 origin "$upstream_commit"
          git checkout --detach FETCH_HEAD
          resolved_commit=$(git rev-parse HEAD)
          endgroup
          log_ok "Resolved commit: $resolved_commit"

          # Newest OpenWrt release of this branch already merged into the resolved commit
          wrt_repo_path=${WRT_REPO#https://github.com/}
          wrt_version=$(
            git ls-remote --tags https://github.com/openwrt/openwrt.git "refs/tags/v${WRT_BRANCH#openwrt-}.*" |
              sed -n 's|^\([0-9a-f]*\)[[:space:]]refs/tags/v\([0-9.]*\)^{}$|\2 \1|p' | sort -rV |
              while read -r version tag_commit; do
                status=$(gh api "repos/${wrt_repo_path%.git}/compare/$tag_commit...$resolved_commit" --jq .status) || exit 1
                log "OpenWrt $version: $status" >&2
                if [ "$status" = ahead ] || [ "$status" = identical ]; then
                  echo "$version"
                  break
                fi
              done
          )
          if [ -z "$wrt_version" ]; then
            die "No OpenWrt release merged into $resolved_commit"
          fi
          log_ok "OpenWrt version: $wrt_version"

          guc_firmware_tag=$(sed -n 's/^PKG_VERSION:=//p' package/firmware/linux-firmware/Makefile | head -1 | tr -d '[:space:]')
          guc_url="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/i915/tgl_guc_70.bin?h=$guc_firmware_tag"
          if ! [[ "$guc_firmware_tag" =~ ^[0-9]{8}$ ]] || ! curl -fsSI --retry 3 -o /dev/null "$guc_url"; then
            die "i915/tgl_guc_70.bin not found at linux-firmware tag ${guc_firmware_tag:-unknown}"
          fi
          log_ok "GuC firmware tag: $guc_firmware_tag"

          feeds_conf="$GITHUB_WORKSPACE/profiles/feeds.conf"
          group "Resolve feeds"
          while read -r _ feed_name feed_src; do
            feed_url=${feed_src%%^*}
            feed_commit=$(git ls-remote "$feed_url" "refs/heads/$WRT_BRANCH" | cut -f1)
            if ! [[ "$feed_commit" =~ ^[0-9a-f]{40}$ ]]; then
              die "Cannot resolve $feed_name at $WRT_BRANCH"
            fi
            log "$feed_name: ${feed_src#*^} -> $feed_commit" >&2
            echo "src-git $feed_name $feed_url^$feed_commit"
          done < "$feeds_conf" > ./feeds.conf
          cp ./feeds.conf "$feeds_conf"
          endgroup

          group_run "Update feeds" ./scripts/feeds update -a

          for patch_file in "$GITHUB_WORKSPACE"/patches/{luci,docker,x86,imagebuilder}/*.patch; do
            if ! git apply --check "$patch_file"; then
              die "Patch failed: ${patch_file#"$GITHUB_WORKSPACE/patches/"}"
            fi
          done
          log_ok "Source patches apply cleanly"

          kernel_patchver=$(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/x86/Makefile | head -1 | tr -d '[:space:]')
          if [ "$kernel_patchver" != "$target_kernel_patchver" ]; then
            die "BBRv3 patches support kernel patch version $target_kernel_patchver, current target is ${kernel_patchver:-unknown}"
          fi

          kernel_version_suffix=$(sed -n "s/^LINUX_VERSION-$kernel_patchver[[:space:]]*=[[:space:]]*//p" "target/linux/generic/kernel-$kernel_patchver" | head -1 | tr -d '[:space:]')
          if [ -z "$kernel_version_suffix" ]; then
            die "Kernel version not found for $kernel_patchver"
          fi
          if [[ "$kernel_version_suffix" = .* ]]; then
            kernel_version="${kernel_patchver}${kernel_version_suffix}"
          else
            kernel_version="$kernel_version_suffix"
          fi
          log_ok "Kernel: $kernel_version"

          target_patch_dir="target/linux/generic/backport-$kernel_patchver"
          mkdir -p "$target_patch_dir"
          rm -f "$target_patch_dir"/010-bbr3-*.patch
          cp "$repo_patch_dir"/010-bbr3-*.patch "$target_patch_dir"/

          copied_count=$(find "$target_patch_dir" -maxdepth 1 -type f -name '010-bbr3-*.patch' | wc -l | tr -d '[:space:]')
          if [ "$copied_count" -ne "$expected_patch_count" ]; then
            die "BBRv3 patch installation failed, copied $copied_count files"
          fi
          log "Installed patches: $copied_count"

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          EOF

          group_run "make defconfig" make defconfig -j"$(nproc)"

          group_run "make target/linux/prepare" make target/linux/prepare V=s
          reject_files=$(find build_dir -name '*.rej')
          if [ -n "$reject_files" ]; then
            echo "$reject_files"
            die "Kernel patch refresh produced reject files"
          fi
          log_ok "No reject files"

          bbr_source=$(find build_dir -path "*/linux-$kernel_version/net/ipv4/tcp_bbr.c" -type f -print -quit)
          if [ -z "$bbr_source" ]; then
            die "Prepared kernel tcp_bbr.c not found"
          fi

          bbr_markers=(
            "/* BBR v3 state: */"
            "static enum tcp_bbr_phase bbr_get_phase"
            "bbr_update_model(sk, rs, &ctx)"
          )
          for marker in "${bbr_markers[@]}"; do
            if ! grep -qF -- "$marker" "$bbr_source"; then
              die "Prepared kernel does not contain BBRv3 marker: $marker"
            fi
          done
          log_ok "BBRv3 kernel source verified: $bbr_source"

          uc_fw_source=$(find build_dir -path "*/linux-$kernel_version/drivers/gpu/drm/i915/gt/uc/intel_uc_fw.c" -type f -print -quit)
          if [ -z "$uc_fw_source" ] ||
            ! grep -qF 'if (IS_ALDERLAKE_P_N(i915))' "$uc_fw_source" ||
            ! grep -qE 'fw_def\(ALDERLAKE_S, +0, guc_maj\(tgl, +70,' "$uc_fw_source"; then
            die "Kernel no longer loads i915/tgl_guc_70.bin on ADL-N, update scripts/customize/files.sh"
          fi
          log_ok "ADL-N GuC firmware verified: tgl_guc_70.bin"

          group_run "make target/linux/clean" make target/linux/clean V=s
          group_run "make target/linux/refresh" make target/linux/refresh V=s

          refreshed_count=$(find "$target_patch_dir" -maxdepth 1 -type f -name '010-bbr3-*.patch' | wc -l | tr -d '[:space:]')
          if [ "$refreshed_count" -ne "$expected_patch_count" ]; then
            die "Refreshed BBRv3 patch count is $refreshed_count"
          fi
          log_ok "Refreshed patches: $refreshed_count"

          cp "$target_patch_dir"/010-bbr3-*.patch "$repo_patch_dir"/

          cd "$GITHUB_WORKSPACE"

          if [ "$resolved_commit" = "$WRT_COMMIT" ]; then
            commit_message="feeds: bump $WRT_BRANCH feeds"
          else
            commit_message="kernel: bump $kernel_patchver to $kernel_version"
            WRT_DATE=$(TZ=Asia/Shanghai date +'%Y%m%d')
          fi

          perl -0pi -e "
            s/^WRT_COMMIT=\"[^\"]*\"/WRT_COMMIT=\"$resolved_commit\"/m;
            s/^WRT_VERSION=\"[^\"]*\"/WRT_VERSION=\"$wrt_version\"/m;
            s/^WRT_DATE=\"[^\"]*\"/WRT_DATE=\"$WRT_DATE\"/m;
            s/^GUC_FIRMWARE_TAG=\"[^\"]*\"/GUC_FIRMWARE_TAG=\"$guc_firmware_tag\"/m;
          " profiles/upstream.conf

          echo "COMMIT_MESSAGE=$commit_message" >> "$GITHUB_ENV"
          log "Commit message: $commit_message"

      - name: Commit Changes
        run: |
          source "$GITHUB_WORKSPACE/scripts/lib/core.sh"

          if git diff --quiet -- profiles/upstream.conf profiles/feeds.conf patches/bbrv3; then
            log_ok "Nothing changed, no commit needed"
            exit 0
          fi

          changed_count=$(git diff --name-only -- profiles/upstream.conf profiles/feeds.conf patches/bbrv3 | wc -l | tr -d '[:space:]')
          log "Changed files: $changed_count"
          git diff --stat -- profiles/upstream.conf profiles/feeds.conf patches/bbrv3

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profiles/upstream.conf profiles/feeds.conf patches/bbrv3
          git commit -m "$COMMIT_MESSAGE"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"

          log_ok "Pushed to $GITHUB_REF_NAME"

      - name: Clean Up
        if: always()
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          out_log: false
          delete_workflows: true
          workflows_keep_day: 0
          workflows_keep_keyword: "Build/Rclone"
