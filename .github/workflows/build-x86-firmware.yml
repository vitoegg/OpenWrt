name: Build-X86-Firmware

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Select build profile'
        required: false
        type: choice
        default: 'Router'
        options:
          - 'Router'
          - 'Cloud'
          - 'Both'
      build_mode:
        description: 'Select build mode'
        required: false
        type: choice
        default: 'ImageBuilder'
        options:
          - 'ImageBuilder'
          - 'FullBuilder'
      force_apps:
        description: 'Force rebuild custom apps'
        required: false
        type: boolean
        default: false
      wan_mode:
        description: 'Select WAN mode'
        required: false
        type: choice
        default: 'Dual WAN'
        options:
          - 'Single WAN'
          - 'Dual WAN'

permissions:
  contents: write
  packages: write

env:
  ROOT_PASSWORD_HASH: ${{ secrets.ROOT_PASSWORD_HASH }}
  PPPOE_USERNAME: ${{ secrets.PPPOE_USERNAME }}
  PPPOE_PASSWORD: ${{ secrets.PPPOE_PASSWORD }}
  PPPOE_MAC: ${{ secrets.PPPOE_MAC }}
  PPPOE_WAN_MAC: ${{ secrets.PPPOE_WAN_MAC }}
  VLAN_ID: ${{ secrets.VLAN_ID }}
  PPPOE_USERNAME_2: ${{ secrets.PPPOE_USERNAME_2 }}
  PPPOE_PASSWORD_2: ${{ secrets.PPPOE_PASSWORD_2 }}
  PPPOE_MAC_2: ${{ secrets.PPPOE_MAC_2 }}
  PPPOE_WAN_MAC_2: ${{ secrets.PPPOE_WAN_MAC_2 }}
  VLAN_ID_2: ${{ secrets.VLAN_ID_2 }}
  ROUTER_MAC: ${{ secrets.ROUTER_MAC }}
  SWITCH_MAC: ${{ secrets.SWITCH_MAC }}
  REDIRECT_SRC_DPORT: ${{ secrets.REDIRECT_SRC_DPORT }}
  REDIRECT_DEST_PORT: ${{ secrets.REDIRECT_DEST_PORT }}
  DNS_FALLBACK_SERVER: ${{ secrets.DNS_FALLBACK_SERVER }}
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
  REPO_URL: ${{ secrets.REPO_URL }}
  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: ${{ matrix.profile }} - ${{ inputs.build_mode }}${{ matrix.profile == 'Router' && format(' - {0}', inputs.wan_mode) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'Both' && '["Router","Cloud"]' || format('["{0}"]', inputs.profile)) }}
    concurrency:
      group: build-x86-firmware-${{ matrix.profile }}-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      BASH_ENV: /tmp/build-x86-${{ matrix.profile }}-ci.log.env
      BUILD_PROFILE: ${{ matrix.profile }}
      ENABLE_DUAL_WAN: ${{ matrix.profile == 'Router' && inputs.wan_mode == 'Dual WAN' }}
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare Environment
        env:
          REQUESTED_BUILD_MODE: ${{ inputs.build_mode }}
          DEBIAN_FRONTEND: noninteractive
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" prepare-environment

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: ◆ Clone Upstream Code
        if: env.BUILD_MODE == 'FullBuilder'
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" clone-source-and-feeds

      - name: ◆ Apply Customizations
        if: env.BUILD_MODE == 'FullBuilder'
        working-directory: ./wrt
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" apply-customizations

      - name: ◆ Restore Cache
        if: env.BUILD_MODE == 'FullBuilder'
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" restore-cache

      - name: ◆ Download Sources
        if: env.BUILD_MODE == 'FullBuilder'
        working-directory: ./wrt
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" download-sources

      - name: ◆ Compile Firmware
        if: env.BUILD_MODE == 'FullBuilder'
        working-directory: ./wrt
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" compile-fullbuilder

      - name: ◆ Publish Cache
        if: env.BUILD_MODE == 'FullBuilder' && env.BUILD_OK == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" save-cache

      - name: ◆ Publish ImageBuilder
        if: env.BUILD_MODE == 'FullBuilder' && env.BUILD_OK == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" publish-imagebuilder

      - name: ◆ Publish SDK
        if: env.BUILD_MODE == 'FullBuilder' && env.BUILD_OK == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" publish-sdk

      - name: ◇ Check Apps
        if: env.BUILD_MODE == 'ImageBuilder'
        env:
          FORCE_APPS: ${{ inputs.force_apps }}
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" check-apps

      - name: ◇ Build Apps
        if: env.BUILD_MODE == 'ImageBuilder' && env.STALE_APPS != ''
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" build-apps

      - name: ◇ Assemble Firmware
        if: env.BUILD_MODE == 'ImageBuilder'
        working-directory: ./ib
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" assemble-imagebuilder

      - name: Deliver Firmware
        if: env.BUILD_OK == 'true'
        working-directory: ./${{ env.BUILD_DIR }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRMWARE_DOWNLOAD_URL: ${{ secrets.FIRMWARE_DOWNLOAD_URL }}
        run: bash "$GITHUB_WORKSPACE/Build/Action/BuildFirmware.sh" deliver-firmware
